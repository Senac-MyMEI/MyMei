<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e9ecef;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .agenda {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .topo {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topo h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .nav a,
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 30px;
            margin: 0 3px;
            display: inline-block;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav a:hover,
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn {
            background: #27ae60;
        }

        .btn:hover {
            background: #219a52;
        }

        .dias-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f1f3f5;
            text-align: center;
            font-weight: bold;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .dia {
            border: 1px solid #eee;
            min-height: 95px;
            padding: 6px;
            background: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dia:hover {
            background: #f8f9fa;
        }

        .dia.hoje {
            background: #fff3cd;
        }

        .dia-outro {
            background: #fef9e6;
            color: #aaa;
        }

        .dia-outro .num-dia {
            opacity: 0.4;
        }

        .num-dia {
            font-weight: bold;
            background: #e9ecef;
            display: inline-block;
            padding: 0 6px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .evento {
            background: #3498db;
            color: white;
            font-size: 0.65rem;
            border-radius: 12px;
            padding: 2px 6px;
            margin: 2px 0;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: transform 0.1s;
        }

        .evento:hover {
            transform: scale(1.02);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 350px;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-box h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin: 8px 0;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid #3498db;
            border-color: transparent;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-acoes {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .modal-acoes button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-salvar {
            background: #27ae60;
            color: white;
        }

        .btn-salvar:hover {
            background: #219a52;
        }

        .btn-cancelar {
            background: #95a5a6;
            color: white;
        }

        .btn-cancelar:hover {
            background: #7f8c8d;
        }

        .btn-excluir {
            background: #c0392b;
            color: white;
        }

        .btn-excluir:hover {
            background: #a93226;
        }

        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            color: #888;
            border-top: 1px solid #eee;
            background: #fafafa;
        }

        @media (max-width: 600px) {
            .topo {
                flex-direction: column;
                text-align: center;
            }

            .nav {
                justify-content: center;
            }

            .dia {
                min-height: 65px;
                padding: 4px;
                font-size: 0.8rem;
            }

            .evento {
                font-size: 0.55rem;
                padding: 1px 4px;
            }

            .modal-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="agenda">
        <div class="topo">
            <h2 id="mesAno"></h2>
            <div class="nav">
                <a href="#" id="btnMesAnterior">◀</a>
                <a href="#" id="btnHoje">Hoje</a>
                <a href="#" id="btnMesProximo">▶</a>
                <button class="btn" id="btnNovoEvento">+ Novo</button>
            </div>
        </div>
        <div class="dias-semana">
            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <div id="gridCalendario" class="grid"></div>
        
    </div>

    <!-- Modal -->
    <div id="modalEvento" class="modal">
        <div class="modal-box">
            <h3 id="modalTitulo">Adicionar Evento</h3>
            <input type="hidden" id="eventoId">
            <input type="text" id="titulo" placeholder="Título" required>
            <textarea id="descricao" placeholder="Descrição"></textarea>
            <input type="time" id="horario">
            <select id="cor">
                <option value="#3498db">Azul</option>
                <option value="#e74c3c">Vermelho</option>
                <option value="#2ecc71">Verde</option>
                <option value="#f39c12">Laranja</option>
            </select>
            <div class="modal-acoes">
                <button class="btn-salvar" id="btnSalvar">Salvar</button>
                <button class="btn-cancelar" id="btnCancelar">Cancelar</button>
                <button class="btn-excluir" id="btnExcluir" style="display:none;">Excluir</button>
            </div>
        </div>
    </div>

    <script>
        let dataAtual = new Date();
        let eventos = {};

        function carregarEventos() {
            const salvos = localStorage.getItem('agenda_eventos');
            if (salvos) {
                eventos = JSON.parse(salvos);
            } else {
                eventos = {
                    "2026-03-07": [{ id: "ev1", titulo: "Aniversário", descricao: "Festa", horario: "19:00", cor: "#e74c3c" }],
                    "2026-03-15": [{ id: "ev2", titulo: "Entregar relatório", descricao: "", horario: "18:00", cor: "#f39c12" }]
                };
            }
        }

        function salvarEventos() {
            localStorage.setItem('agenda_eventos', JSON.stringify(eventos));
        }

        function gerarId() {
            return Date.now() + '-' + Math.random().toString(36).substr(2, 6);
        }

        function salvarEvento(data, id, titulo, descricao, horario, cor) {
            if (!eventos[data]) eventos[data] = [];
            if (id) {
                const index = eventos[data].findIndex(ev => ev.id === id);
                if (index !== -1) {
                    eventos[data][index] = { id, titulo, descricao, horario, cor };
                }
            } else {
                const novoId = gerarId();
                eventos[data].push({ id: novoId, titulo, descricao, horario, cor });
            }
            salvarEventos();
            renderizarCalendario();
        }

        function excluirEvento(data, id) {
            if (eventos[data]) {
                eventos[data] = eventos[data].filter(ev => ev.id !== id);
                if (eventos[data].length === 0) delete eventos[data];
                salvarEventos();
                renderizarCalendario();
            }
        }

        function renderizarCalendario() {
            const ano = dataAtual.getFullYear();
            const mes = dataAtual.getMonth();
            const primeiroDia = new Date(ano, mes, 1);
            const inicioSemana = primeiroDia.getDay();
            const diasNoMes = new Date(ano, mes + 1, 0).getDate();
            const hoje = new Date().toISOString().slice(0, 10);

            const mesesNomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            document.getElementById('mesAno').innerText = `${mesesNomes[mes]} ${ano}`;

            const grid = document.getElementById('gridCalendario');
            grid.innerHTML = '';

            let dia = 1;
            for (let i = 0; i < 42; i++) {
                const celula = document.createElement('div');
                celula.className = 'dia';
                if (i >= inicioSemana && dia <= diasNoMes) {
                    const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                    if (dataStr === hoje) celula.classList.add('hoje');

                    const numDiv = document.createElement('div');
                    numDiv.className = 'num-dia';
                    numDiv.innerText = dia;
                    celula.appendChild(numDiv);

                    if (eventos[dataStr]) {
                        eventos[dataStr].forEach(ev => {
                            const evDiv = document.createElement('div');
                            evDiv.className = 'evento';
                            evDiv.style.backgroundColor = ev.cor;
                            evDiv.innerText = (ev.horario ? ev.horario + ' ' : '') + ev.titulo;
                            evDiv.onclick = (e) => {
                                e.stopPropagation();
                                abrirModalEditar(dataStr, ev.id, ev.titulo, ev.descricao, ev.horario, ev.cor);
                            };
                            celula.appendChild(evDiv);
                        });
                    }

                    celula.onclick = () => abrirModalAdicionar(dataStr);
                    dia++;
                } else {
                    const numDiv = document.createElement('div');
                    numDiv.className = 'num-dia';
                    numDiv.style.opacity = '0.4';
                    let outroDia;
                    if (i < inicioSemana) {
                        const diasMesAnterior = new Date(ano, mes, 0).getDate();
                        outroDia = diasMesAnterior - (inicioSemana - i) + 1;
                    } else {
                        outroDia = i - inicioSemana - diasNoMes + 1;
                    }
                    numDiv.innerText = outroDia;
                    celula.appendChild(numDiv);
                    celula.classList.add('dia-outro');
                }
                grid.appendChild(celula);
            }
        }

        const modal = document.getElementById('modalEvento');
        let currentData = '';
        let currentId = '';

        function abrirModalAdicionar(data) {
            currentData = data;
            currentId = '';
            document.getElementById('modalTitulo').innerText = 'Adicionar Evento';
            document.getElementById('eventoId').value = '';
            document.getElementById('titulo').value = '';
            document.getElementById('descricao').value = '';
            document.getElementById('horario').value = '';
            document.getElementById('cor').value = '#3498db';
            document.getElementById('btnExcluir').style.display = 'none';
            modal.style.display = 'flex';
        }

        function abrirModalEditar(data, id, titulo, descricao, horario, cor) {
            currentData = data;
            currentId = id;
            document.getElementById('modalTitulo').innerText = 'Editar Evento';
            document.getElementById('eventoId').value = id;
            document.getElementById('titulo').value = titulo;
            document.getElementById('descricao').value = descricao;
            document.getElementById('horario').value = horario || '';
            document.getElementById('cor').value = cor;
            document.getElementById('btnExcluir').style.display = 'inline-block';
            modal.style.display = 'flex';
        }

        function fecharModal() {
            modal.style.display = 'none';
        }

        document.getElementById('btnSalvar').onclick = () => {
            const titulo = document.getElementById('titulo').value.trim();
            if (!titulo) return alert('Título é obrigatório');
            const descricao = document.getElementById('descricao').value;
            const horario = document.getElementById('horario').value;
            const cor = document.getElementById('cor').value;
            salvarEvento(currentData, currentId, titulo, descricao, horario, cor);
            fecharModal();
        };

        document.getElementById('btnExcluir').onclick = () => {
            if (confirm('Excluir evento?')) {
                excluirEvento(currentData, currentId);
                fecharModal();
            }
        };

        document.getElementById('btnCancelar').onclick = fecharModal;
        window.onclick = (e) => { if (e.target === modal) fecharModal(); };

        document.getElementById('btnMesAnterior').onclick = (e) => {
            e.preventDefault();
            dataAtual.setMonth(dataAtual.getMonth() - 1);
            renderizarCalendario();
        };

        document.getElementById('btnMesProximo').onclick = (e) => {
            e.preventDefault();
            dataAtual.setMonth(dataAtual.getMonth() + 1);
            renderizarCalendario();
        };

        document.getElementById('btnHoje').onclick = (e) => {
            e.preventDefault();
            dataAtual = new Date();
            renderizarCalendario();
        };

        document.getElementById('btnNovoEvento').onclick = () => {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = hoje.getMonth() + 1;
            const dia = hoje.getDate();
            const dataHoje = `${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
            abrirModalAdicionar(dataHoje);
        };

        carregarEventos();
        renderizarCalendario();
    </script>
</body>
</html>
